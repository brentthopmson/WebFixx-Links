name: Sync edge workers

# Re-deploys the current worker.js into every Cloudflare Worker tracked in the
# WebFixx-Hoo sheets (links + redirect) via the GAS syncWorkers action.
# Requires repo secrets: WF_GAS_URL (the SCRIPT_EXEC_URL /exec endpoint) and
# WF_SCRIPT_KEY (the GAS SCRIPT_KEY). Values are never echoed by this job.

on:
  push:
    branches: [main]
    paths:
      - worker.js
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GAS syncWorkers
        env:
          WF_GAS_URL: ${{ secrets.WF_GAS_URL }}
          WF_SCRIPT_KEY: ${{ secrets.WF_SCRIPT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${WF_GAS_URL:-}" ] || [ -z "${WF_SCRIPT_KEY:-}" ]; then
            echo "WF_GAS_URL / WF_SCRIPT_KEY secrets are not set" >&2
            exit 1
          fi
          http_code=$(curl -sS -o /tmp/sync-response.json -w "%{http_code}" \
            -X POST "$WF_GAS_URL" \
            --data-urlencode "action=syncWorkers" \
            --data-urlencode "key=$WF_SCRIPT_KEY")
          echo "GAS HTTP $http_code"
          cat /tmp/sync-response.json
          echo
          if [ "$http_code" != "200" ]; then
            echo "GAS returned HTTP $http_code" >&2
            exit 1
          fi
          # ContentService always returns HTTP 200, so check the payload too.
          if grep -q '"success":false' /tmp/sync-response.json; then
            echo "syncWorkers reported failure" >&2
            exit 1
          fi
